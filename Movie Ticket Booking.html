<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
</head>

<body>

    <h1 align="center">🎬 Online Movie Ticket Booking 🎬</h1>
    <p align="center"><i>Book your favorite movie</i></p>

    <hr>

    <form>

        <p>
            <label>Customer Name:</label><br>
            <input type="text">
        </p>

        <p>
            <label>Movie Name:</label><br>
            <select>
                <option>Avengers</option>
                <option>Inception</option>
                <option>Interstellar</option>
                <option>Jawan</option>
            </select>
        </p>

        <p>
            <label>Show Time:</label><br>
            <select>
                <option>10:00 AM</option>
                <option>1:00 PM</option>
                <option>4:00 PM</option>
                <option>7:00 PM</option>
            </select>
        </p>

        <p>
            <label>Number of Tickets:</label><br>
            <input type="number">
        </p>

        <p>
            <label>Seat Type:</label><br>
            <input type="radio" name="seat"> Normal
            <input type="radio" name="seat"> Premium
        </p>

        <p>
            <input type="submit" value="Book Tickets">
            <input type="reset" value="Reset">
        </p>

    </form>

    <hr>
    <p align="center">Enjoy the Movie 🍿</p>

</body>
</html>
