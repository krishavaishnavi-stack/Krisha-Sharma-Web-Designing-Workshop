<!DOCTYPE html>
<html>
<head>
    <title>Online Food Order</title>
</head>

<body>

    <h1 align="center">🍕 Online Food Ordering System 🍔</h1>
    <hr>

    <h2>Menu</h2>
    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
        <li>Sandwich</li>
        <li>Cold Drink</li>
    </ul>

    <hr>

    <h2>Order Details</h2>

    <form>

        <p>
            <label>Customer Name:</label><br>
            <input type="text">
        </p>

        <p>
            <label>Food Item:</label><br>
            <select>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Pasta</option>
                <option>Sandwich</option>
            </select>
        </p>

        <p>
            <label>Quantity:</label><br>
            <input type="number">
        </p>

        <p>
            <label>Delivery Type:</label><br>
            <input type="radio" name="delivery"> Home Delivery
            <input type="radio" name="delivery"> Take Away
        </p>

        <p>
            <input type="submit" value="Place Order">
            <input type="reset" value="Cancel">
        </p>

    </form>

    <hr>
    <p align="center">Thank you for ordering!</p>

</body>
</html>
