<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #0077cc;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }

        button:hover {
            background-color: #005fa3;
        }

        .confirmation {
            margin-top: 20px;
            padding: 15px;
            background-color: #e6f7ff;
            border: 1px solid #0077cc;
            border-radius: 5px;
            display: none;
        }

        #totalCost {
            font-weight: bold;
            color: #0077cc;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hotel Booking Form</h1>

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label for="checkin">Check-in Date</label>
    <input type="date" id="checkin">

    <label for="checkout">Check-out Date</label>
    <input type="date" id="checkout">

    <label for="roomType">Room Type</label>
    <select id="roomType" onchange="updateTotal()">
        <option value="AC">AC - ₹2000/day</option>
        <option value="Non-AC">Non-AC - ₹1000/day</option>
    </select>

    <label for="rooms">Number of Rooms</label>
    <input type="number" id="rooms" min="1" value="1" onchange="updateTotal()">

    <label for="guests">Number of Guests</label>
    <input type="number" id="guests" min="1" value="1">

    <p id="totalCost">Total Cost: ₹0</p>

    <button onclick="bookHotel()">Book Now</button>

    <div class="confirmation" id="confirmation"></div>
</div>

<script>
    function calculateDays(checkin, checkout) {
        const start = new Date(checkin);
        const end = new Date(checkout);
        const diffTime = end - start;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? diffDays : 0;
    }

    function updateTotal() {
        const roomType = document.getElementById('roomType').value;
        const rooms = parseInt(document.getElementById('rooms').value);
        const checkin = document.getElementById('checkin').value;
        const checkout = document.getElementById('checkout').value;

        if (!checkin || !checkout || rooms <= 0) {
            document.getElementById('totalCost').innerText = "Total Cost: ₹0";
            return;
        }

        const days = calculateDays(checkin, checkout);
        const pricePerDay = roomType === "AC" ? 2000 : 1000;
        const total = pricePerDay * rooms * days;

        document.getElementById('totalCost').innerText = "Total Cost: ₹" + total;
    }

    function bookHotel() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const checkin = document.getElementById('checkin').value;
        const checkout = document.getElementById('checkout').value;
        const roomType = document.getElementById('roomType').value;
        const rooms = document.getElementById('rooms').value;
        const guests = document.getElementById('guests').value;

        if (!name || !email || !checkin || !checkout || !rooms || !guests) {
            alert("Please fill all fields!");
            return;
        }

        const days = calculateDays(checkin, checkout);
        if (days <= 0) {
            alert("Check-out date must be after check-in date!");
            return;
        }

        const pricePerDay = roomType === "AC" ? 2000 : 1000;
        const total = pricePerDay * rooms * days;

        const confirmation = document.getElementById('confirmation');
        confirmation.style.display = "block";
        confirmation.innerHTML = `
            <h3>Booking Confirmed!</h3>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Email:</strong> ${email}</p>
            <p><strong>Check-in:</strong> ${checkin}</p>
            <p><strong>Check-out:</strong> ${checkout}</p>
            <p><strong>Room Type:</strong> ${roomType}</p>
            <p><strong>Number of Rooms:</strong> ${rooms}</p>
            <p><strong>Number of Guests:</strong> ${guests}</p>
            <p><strong>Total Cost:</strong> ₹${total}</p>
        `;
    }

    // Update total cost whenever dates change
    document.getElementById('checkin').addEventListener('change', updateTotal);
    document.getElementById('checkout').addEventListener('change', updateTotal);
</script>

</body>
</html>
