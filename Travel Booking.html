<!DOCTYPE html>
<html>
<head>
    <title>Travel Booking</title>
</head>

<body>

    <h1 align="center">✈️ Travel Booking System</h1>
    <p align="center"><i>Plan your journey with us</i></p>

    <hr>

    <form>

        <p>
            <label>Traveler Name:</label><br>
            <input type="text">
        </p>

        <p>
            <label>From:</label><br>
            <input type="text">
        </p>

        <p>
            <label>To:</label><br>
            <input type="text">
        </p>

        <p>
            <label>Travel Date:</label><br>
            <input type="date">
        </p>

        <p>
            <label>Mode of Travel:</label><br>
            <select>
                <option>Bus</option>
                <option>Train</option>
                <option>Flight</option>
            </select>
        </p>

        <p>
            <label>Class:</label><br>
            <input type="radio" name="class"> Economy
            <input type="radio" name="class"> Business
        </p>

        <p>
            <input type="submit" value="Book Ticket">
            <input type="reset" value="Cancel">
        </p>

    </form>

    <hr>
    <p align="center">Happy Journey 😊</p>

</body>
</html>
