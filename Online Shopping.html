<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>
</head>

<body>

    <h1 align="center">🛒 Online Shopping Store 🛒</h1>
    <p align="center"><i>Best deals available</i></p>

    <hr>

    <h2>Products</h2>
    <ul>
        <li>Mobile Phone</li>
        <li>Laptop</li>
        <li>Headphones</li>
        <li>Smart Watch</li>
    </ul>

    <hr>

    <form>

        <p>
            <label>Customer Name:</label><br>
            <input type="text">
        </p>

        <p>
            <label>Select Product:</label><br>
            <select>
                <option>Mobile Phone</option>
                <option>Laptop</option>
                <option>Headphones</option>
                <option>Smart Watch</option>
            </select>
        </p>

        <p>
            <label>Quantity:</label><br>
            <input type="number">
        </p>

        <p>
            <label>Payment Method:</label><br>
            <input type="radio" name="pay"> Cash on Delivery
            <input type="radio" name="pay"> UPI
            <input type="radio" name="pay"> Card
        </p>

        <p>
            <label>Delivery Address:</label><br>
            <textarea rows="4" cols="30"></textarea>
        </p>

        <p>
            <input type="submit" value="Place Order">
            <input type="reset" value="Cancel">
        </p>

    </form>

    <hr>
    <p align="center">Thank you for shopping with us 😊</p>

</body>
</html>
